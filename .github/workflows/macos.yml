name: Ушастик — сборка и тест macOS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            python_arch: arm64
          - runner: macos-15-intel
            arch: x86_64
            python_arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python_arch }}
      - name: Зависимости для этой архитектуры
        run: python -m pip install -r requirements.txt -c macos/constraints.txt
      - name: Проверить обработку слов и спикеров
        run: python -m unittest test_stitch test_diarization test_engine_boundaries
      - name: Подготовить модели с проверкой SHA-256
        run: python fetch_models.py
      - name: Собрать и подписать .app
        run: python build_macos.py --arch '${{ matrix.arch }}'
      - name: Проверить на настоящем Mac
        run: python test_macos_acceptance.py --app dist/Ушастик.app --work acceptance --fixtures fixtures
      - name: Проверить распакованный архив
        run: |
          mkdir -p .build/unpacked
          /usr/bin/ditto -x -k 'dist/Ушастик-macOS-${{ matrix.arch }}-0.3.1.zip' .build/unpacked
          /usr/bin/codesign --verify --deep --strict .build/unpacked/Ушастик.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ushastik-macOS-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/build-macos.json
            acceptance/
            .build/macos/pyinstaller/Ushastik/warn-Ushastik.txt
          retention-days: 7
          if-no-files-found: warn
